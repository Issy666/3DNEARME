<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalPrint — Printers near you</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
<link rel="stylesheet" href="theme.css">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:var(--font-body); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:var(--font-mono);}
  a{color:inherit;}

  header{
    position:sticky; top:0; z-index:30;
    background:rgba(241,243,239,0.95);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:1280px; margin:0 auto; padding:0 24px;
    display:flex; align-items:center; justify-content:space-between; height:64px; gap:24px;
  }
  .wordmark{
    font-family:var(--font-mono); font-weight:600;
    font-size:15px; letter-spacing:0.12em; text-decoration:none; white-space:nowrap;
  }
  .wordmark span{color:var(--light-red);}
  .searchbar{
    flex:1; max-width:420px;
    display:flex; border:1px solid var(--line); background:var(--paper-raised);
    border-radius:var(--radius); padding:5px;
  }
  .searchbar input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:var(--font-body); font-size:14px; padding:8px 10px;
  }
  .searchbar button{
    font-family:var(--font-mono); font-size:12.5px; font-weight:600;
    background:var(--ink); color:var(--paper); border:none; border-radius:var(--radius);
    padding:0 16px; cursor:pointer;
  }
  .btn-list{
    font-family:var(--font-mono); font-size:13px; font-weight:500;
    background:var(--light-red); color:#fff; padding:9px 16px; border-radius:var(--radius);
    text-decoration:none; white-space:nowrap;
  }

  .results-head{
    max-width:1280px; margin:0 auto; padding:22px 24px 6px;
  }
  .results-head h1{font-size:20px; font-weight:600;}
  .results-head .meta{color:var(--muted); font-size:13.5px; margin-top:4px;}
  .results-head .meta .mono{color:var(--red);}

  .layout{
    max-width:1280px; margin:0 auto; padding:16px 24px 60px;
    display:grid; grid-template-columns:420px 1fr; gap:24px;
    align-items:start;
  }
  .list{
    display:flex; flex-direction:column; gap:14px;
  }
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; cursor:pointer; transition:border-color .15s ease, transform .1s ease;
  }
  .card:hover, .card.active{border-color:var(--light-red);}
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px;
  }
  .card h3{font-size:16px; font-weight:600;}
  .card .suburb{color:var(--muted); font-size:13px; margin-top:2px;}
  .distance{
    font-family:var(--font-mono); font-size:12.5px; font-weight:600;
    color:var(--red); background:#E3F2F0; padding:4px 8px; border-radius:var(--radius);
    white-space:nowrap;
  }
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
  .chip{
    font-family:var(--font-mono); font-size:11.5px;
    border:1px solid var(--line); border-radius:var(--radius); padding:3px 8px; color:var(--muted);
  }
  .card p.blurb{font-size:13.5px; color:var(--muted); margin-bottom:10px;}
  .card-foot{display:flex; justify-content:space-between; align-items:center;}
  .status{
    font-family:var(--font-mono); font-size:11.5px; color:var(--muted);
    display:flex; align-items:center; gap:6px;
  }
  .status .dot{width:6px; height:6px; border-radius:50%; background:var(--status-online);}
  .card-foot a{
    font-size:13px; font-weight:600; color:var(--red); text-decoration:none;
  }

  #map{
    height:calc(100vh - 180px); min-height:480px;
    position:sticky; top:88px;
    border:1px solid var(--line); border-radius:var(--radius);
  }

  .leaflet-popup-content-wrapper{border-radius:2px; font-family:var(--font-body);}
  .popup-name{font-weight:600; font-size:13.5px;}
  .popup-dist{font-family:var(--font-mono); font-size:11.5px; color:#137168;}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
    #map{position:static; height:340px;}
    .searchbar{max-width:none;}
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="wordmark">LOCAL<span>PRINT</span></a>
    <form class="searchbar" onsubmit="handleSearch(event)">
      <input type="text" id="suburbInput" placeholder="Search a suburb or postcode" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <a href="signup.html" class="btn-list">List your printer</a>
  </div>
</header>

<div class="results-head">
  <h1 id="resultsTitle">Printers near you</h1>
  <p class="meta" id="resultsMeta">Showing <span class="mono">0</span> results, closest first</p>
</div>

<div class="layout">
  <div class="list" id="list"></div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---- Mock data (replace with a fetch() to your /api/search endpoint) ----
  const PRINTERS = [
    { id:1, alias:"Owen's Garage Print Co.", suburb:"West End", distanceKm:1.2, model:"Bambu Lab P1S", materials:["PLA","PETG","TPU"], blurb:"Fast turnaround, mostly do functional parts and cosplay props.", online:true, lat:-27.4820, lng:153.0100 },
    { id:2, alias:"M. Chen — Prototyping", suburb:"South Brisbane", distanceKm:2.4, model:"Prusa MK4", materials:["PLA","ABS"], blurb:"Engineer by trade, good for precision prototypes and jigs.", online:true, lat:-27.4770, lng:153.0190 },
    { id:3, alias:"The Spool Shed", suburb:"Highgate Hill", distanceKm:3.1, model:"Creality K1 Max", materials:["PLA","PETG"], blurb:"Large build volume, happy to batch print multiples.", online:false, lat:-27.4880, lng:153.0140 },
    { id:4, alias:"Resin & Rust", suburb:"Woolloongabba", distanceKm:4.6, model:"Elegoo Saturn (Resin)", materials:["Resin"], blurb:"High-detail resin work — miniatures, jewellery masters.", online:true, lat:-27.4890, lng:153.0360 },
    { id:5, alias:"Milton Makerspace", suburb:"Milton", distanceKm:5.8, model:"Bambu Lab X1C", materials:["PLA","PETG","Nylon"], blurb:"Community makerspace printer, small fee covers material.", online:true, lat:-27.4680, lng:152.9990 },
  ];

  const params = new URLSearchParams(window.location.search);
  const suburb = params.get('suburb') || '';
  document.getElementById('suburbInput').value = suburb;
  document.getElementById('resultsTitle').textContent = suburb ? `Printers near “${suburb}”` : 'Printers near you';

  // Simple filter placeholder — in production this is a real geocode + distance query
  const results = [...PRINTERS].sort((a,b) => a.distanceKm - b.distanceKm);
  document.getElementById('resultsMeta').innerHTML =
    `Showing <span class="mono">${results.length}</span> results, closest first`;

  // ---- Render list ----
  const listEl = document.getElementById('list');
  results.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = p.id;
    card.innerHTML = `
      <div class="card-top">
        <div>
          <h3>${p.alias}</h3>
          <div class="suburb">${p.suburb}</div>
        </div>
        <span class="distance mono">&Delta; ${p.distanceKm.toFixed(1)} KM</span>
      </div>
      <div class="chips">
        <span class="chip">${p.model}</span>
        ${p.materials.map(m => `<span class="chip">${m}</span>`).join('')}
      </div>
      <p class="blurb">${p.blurb}</p>
      <div class="card-foot">
        <span class="status"><span class="dot" style="background:${p.online ? 'var(--status-online)' : 'var(--status-offline)'}"></span>${p.online ? 'Active this week' : 'Inactive'}</span>
        <a href="profile.html?id=${p.id}">View profile →</a>
      </div>
    `;
    card.addEventListener('click', () => focusMarker(p.id));
    listEl.appendChild(card);
  });

  // ---- Map ----
  const map = L.map('map', { scrollWheelZoom: false }).setView([-27.4820, 153.0170], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  const markers = {};
  results.forEach(p => {
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: 9,
      color: '#600D07',
      fillColor: '#B8230D',
      fillOpacity: 0.9,
      weight: 2
    }).addTo(map);
    marker.bindPopup(`<div class="popup-name">${p.alias}</div><div class="popup-dist">Δ ${p.distanceKm.toFixed(1)} km · ${p.suburb}</div>`);
    marker.on('click', () => focusCard(p.id));
    markers[p.id] = marker;
  });

  function focusMarker(id){
    const m = markers[id];
    if(!m) return;
    map.panTo(m.getLatLng());
    m.openPopup();
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', Number(c.dataset.id) === id));
  }
  function focusCard(id){
    document.querySelectorAll('.card').forEach(c => {
      const match = Number(c.dataset.id) === id;
      c.classList.toggle('active', match);
      if(match) c.scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  }

  function handleSearch(e){
    e.preventDefault();
    const val = document.getElementById('suburbInput').value.trim();
    window.location.href = 'search.html' + (val ? ('?suburb=' + encodeURIComponent(val)) : '');
  }
</script>

</body>
</html>
